<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portafolio – Revista 3D Editable</title>

  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- SONIDO -->
  <audio id="flipSound" preload="auto">
    <source src="sounds/page-flip.mp3" type="audio/mpeg">
  </audio>

  <!-- BOTONES SUPERIORES -->
  <a href="https://wa.me/573057505025" target="_blank"
     class="fixed-btn whatsapp-btn">WhatsApp</a>

  <button class="fixed-btn download-btn"
          onclick="descargarPDF()">Descargar PDF</button>

  <button id="editorToggle" class="fixed-btn editor-btn"
          style="display:none;"></button>

  <!-- LIBRO -->
  <div class="book" id="magazine"></div>

  <!-- CONTROLES INFERIORES -->
  <div class="controls">
    <button id="btnPrev" class="ctrl-btn" onclick="prevPage()">« Anterior</button>
    <button id="btnNext" class="ctrl-btn" onclick="nextPage()">Siguiente »</button>

    <!-- Botones de layout (solo en edición) -->
    <input id="importFile" type="file" accept=".json" style="display:none" />

    <button id="btnSave" class="ctrl-btn" style="display:none"
            onclick="saveLayout()">Guardar</button>

    <button id="btnExport" class="ctrl-btn" style="display:none"
            onclick="exportLayout()">Exportar</button>

    <button id="btnImport" class="ctrl-btn" style="display:none"
            onclick="document.getElementById('importFile').click()">Importar</button>
  </div>

  <!-- CONTENIDO PARA PDF -->
  <div id="portafolioPDF" style="display:none;"></div>

  <!-- LIBRERÍA PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- CONTENIDO DEL PORTAFOLIO -->
  <script src="JS/content.js"></script>

  <!-- LAYOUT DEL SERVIDOR (opcional) -->
  <script>
    window.initialLayoutFromServer = null;
    fetch('data/layout.json')
      .then(r => r.ok ? r.json() : null)
      .then(j => window.initialLayoutFromServer = j)
      .catch(()=>{});
  </script>

  <!-- SCRIPT PRINCIPAL -->
  <script src="JS/script.js"></script>

</body>
</html>
